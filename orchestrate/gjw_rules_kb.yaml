spec_version: v1
kind: knowledge_base
name: gjw_rules_kb
description: >
  119 긴급출동 선행 드론·진로방해 차량 통보에 관한 지식 문서 5개.
  (1) 관련 법령 조문 원문 발췌 — 도로교통법 제29조·제32조, 소방기본법 제21조·제21조의2·제25조, 항공안전법 제127조·제131조의2 현행 원문.
  (2) 단속 규정 요약 — 사유별 근거 표기, 통보 초안 처리 원칙, 관제권 운영 규칙.
  (3) 드론 선행 출동 운용 절차서(가상) — 역할(원격 조종자가 항상 조종), 투입 기준, 배차·동시 출발, 권장 경로, 막힘 발견·우회로 안내, 조종자 판단 우선, 개인정보, 복귀.
  (4) 진로방해 차량 지자체 통보 양식과 작성 요령(가상) — 양식 항목, 사유별 법적 근거, 증거 요건, 검토 절차(자동 통보 없음).
  (5) 시제품 사용 절차(가상) — 화면 흐름(투입 승인 → 동시 출발 → 막힘 발견 → 우회로 승인 → 통보 초안 검토 → 담당자 별도 통보), 누가 무엇을 하는지, 시연 예외 처리.
  법령 조문, 주정차 금지 장소, 소방차 출동 방해, 견인 지원 요청, 드론 비행승인·관제권, 드론 운용 절차, 통보서 작성, 시제품 사용법에 관한 질문에 사용합니다.
